<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Basic Food Mart — Order Online</title>
  <meta name="description" content="Order your favorites from Basic Food Mart. Fresh food, fast pickup or delivery."/>
  <meta name="theme-color" content="#c8102e"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #c8102e;
      --red-dark: #a00d24;
      --red-light:#fdecea;
      --green:    #2d7a3a;
      --bg:       #f5f5f5;
      --card:     #ffffff;
      --border:   #e0e0e0;
      --text:     #1a1a1a;
      --muted:    #666666;
      --radius:   12px;
      --shadow:   0 2px 12px rgba(0,0,0,.08);
      --shadow-lg:0 8px 32px rgba(0,0,0,.14);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    /* ── Animations ── */
    @keyframes fadeIn   { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideUp  { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn  { from { transform:translateX(100%); } to { transform:translateX(0); } }
    @keyframes spin     { to { transform:rotate(360deg); } }
    @keyframes pulse    { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
    @keyframes toastIn  { from { opacity:0; transform:translateY(20px) scale(.95); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(-10px) scale(.95); } }

    /* ── Toast ── */
    #toast-area {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 11px 22px; border-radius: 30px; font-weight: 600; font-size: 14px;
      color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.2);
      animation: toastIn .25s ease, toastOut .3s ease 2.7s forwards;
      pointer-events: none;
    }
    .toast.success { background: var(--green); }
    .toast.error   { background: #c62828; }
    .toast.info    { background: #1565c0; }

    /* ── Spinner ── */
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: var(--red); border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px;
      font-weight: 700; cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--red-dark); }
    .btn-outline { background: transparent; color: var(--red); border: 2px solid var(--red); }
    .btn-outline:hover:not(:disabled) { background: var(--red-light); }
    .btn-green  { background: var(--green); color: #fff; }
    .btn-green:hover:not(:disabled) { background: #225c2c; }
    .btn-gray   { background: #f0f0f0; color: var(--text); }
    .btn-gray:hover:not(:disabled) { background: #e0e0e0; }

    /* ── Input ── */
    .input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 15px; font-family: inherit;
      transition: border-color .15s; background: #fff; color: var(--text); outline: none;
    }
    .input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(200,16,46,.1); }
    .input::placeholder { color: #aaa; }
    label.field-label {
      display: block; font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px;
    }

    /* ── Overlay ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 400; display: flex; align-items: center; justify-content: center;
      padding: 16px; animation: fadeIn .2s ease;
    }
    .modal {
      background: #fff; border-radius: 16px; width: 100%; max-width: 520px;
      max-height: 90vh; overflow-y: auto; animation: slideUp .3s ease;
      box-shadow: var(--shadow-lg);
    }
    .modal-header {
      position: sticky; top: 0; background: #fff; padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-between; z-index: 10;
    }
    .modal-header h2 { font-size: 18px; font-weight: 800; }
    .close-btn {
      width: 34px; height: 34px; border: none; background: #f5f5f5;
      border-radius: 50%; font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background .15s;
    }
    .close-btn:hover { background: #eee; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-area"></div>

  <!-- React + Babel (CDN — no build step needed) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- App -->
  <script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
